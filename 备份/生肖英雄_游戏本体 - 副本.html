function diceDist(n){let d=[1];for(let i=0;i<n;i++){const nd=new Array(d.length+6).fill(0);for(let s=0;s<d.length;s++)if(d[s])for(let f=1;f<=6;f++)nd[s+f]+=d[s];d=nd;}return d;}
const PLAN=(()=>{
  const plan={1:{D6:4,P:9,wr:0.946},2:{D6:5,P:15,wr:0.779}};
  let prevWr=0.779,prevP=15,prevD6=5;
  for(let id=3;id<=50;id++){
    const target=0.90-(id-3)*(0.38/47);
    let best=null;
    for(let D6=prevD6;D6<=Math.min(9,prevD6+1);D6++){
      const dist=diceDist(D6),total=Math.pow(6,D6);
      for(let P=Math.max(prevP,D6);P<=Math.min(6*D6,40);P++){
        let ge=0;for(let s=P;s<=6*D6;s++)ge+=dist[s];
        const wr=ge/total;
        if(wr>prevWr+0.004)continue;
        const score=Math.abs(wr-target)+(P-prevP)*0.0008;
        if(!best||score<best.score)best={D6:D6,P:P,wr:wr,score:score};
      }
    }
    if(!best)best={D6:prevD6,P:Math.min(prevP+1,6*prevD6),wr:0};
    plan[id]=best;prevWr=best.wr;prevP=best.P;prevD6=best.D6;
  }
  return plan;
})();
function genPath(rng,P,shape){
  const DIRS=[[1,0],[0,1],[-1,0],[0,-1]],seen=new Set();
  let c=Math.floor(rng()*GRID_SIZE),r=Math.floor(rng()*GRID_SIZE),dir=Math.floor(rng()*4);
  const cells=[[c,r]];seen.add(c+","+r);
  const contW=shape===1?9:shape===2?5:3.5,turnR=shape===3;
  for(let step=0;step<P;step++){
    const cand=[];
    for(let d=0;d<4;d++){
      const nc=c+DIRS[d][0],nr=r+DIRS[d][1];
      if(nc<0||nc>=GRID_SIZE||nr<0||nr>=GRID_SIZE||seen.has(nc+","+nr))continue;
      let w=1;if(d===dir)w=contW;else if(d===(dir+(turnR?1:(rng()<0.5?1:3)))%4)w=2.5;
      cand.push([nc,nr,d,w]);
    }
    if(!cand.length)return null;
    let tot=0;for(const x of cand)tot+=x[3];
    let pick=rng()*tot,chosen=cand[0];
    for(const x of cand){pick-=x[3];if(pick<=0){chosen=x;break;}}
    c=chosen[0];r=chosen[1];dir=chosen[2];cells.push([c,r]);seen.add(c+","+r);
  }
  return cells;
}
function genLevel(id){
  const rng=mulberry32(id*7919+13);
  const plan=PLAN[id];
  let D6=plan.D6,P=plan.P;
  // 马跃(31):路径需≥30格(总行动30格);蛇/龙/兔关适当拉长路径,平衡特殊胜利条件
  if(id===31)P=Math.max(P,30);
  if(id===27)P=Math.max(P,20);
  if(id===23)P=Math.max(P,18);
  if(id===19)P=Math.max(P,16);
  const shape=id<=10?1:id<=20?2:(id%3)+1;
  let cells=null;
  for(let a=0;a<400&&!cells;a++)cells=genPath(rng,P,shape);
  if(!cells){cells=[];for(let i=0;i<=P;i++)cells.push([i%GRID_SIZE,Math.floor(i/GRID_SIZE)]);}
  const gainV=id<=20?2:id<=40?3:4;
  const G=Math.max(1,Math.round(P*0.78));
  const gSet=new Set();
  while(gSet.size<G)gSet.add(1+Math.floor(rng()*(P-1)));
  const bossV=Math.round((4+G*gainV)*Math.min(1,0.8+id*0.0045));
  const path=[];let arrive=4;
  for(let i=0;i<=P;i++){
    const cell=cells[i];
    if(i===0){path.push({c:cell[0],r:cell[1],t:"start"});continue;}
    if(i===P){path.push({c:cell[0],r:cell[1],t:"boss",v:bossV});continue;}
    if(gSet.has(i)){arrive+=gainV;path.push({c:cell[0],r:cell[1],t:"gain"});}
    else{const v=Math.max(2,Math.round(arrive*(0.5+rng()*0.45)));path.push({c:cell[0],r:cell[1],t:"mob",v:v});}
  }
  // 宝箱内容一律由地图编辑器人工设定,生成关卡不自动生成宝箱/金币/骰子格。
  // 例外:鼠Boss关(第7关)自动放2个数值宝箱作为数值来源(鼠Boss会随杀敌成长,宝箱助过关),
  // 注意鼠Boss胜利条件=数值≥Boss(含成长),并无"开2个宝箱"要求(详见设计稿).
  const bi=BOSS_LV.indexOf(id);
  if(bi>=0&&ZOD[bi]==="鼠"){
    const ra=id<=16?6:id<=33?15:30; // 早期/中期/后期参考值
    const interior=[];for(let i=1;i<P;i++)interior.push(i);
    for(let a=0;a<interior.length;a++){const j=a+Math.floor(rng()*(interior.length-a));[interior[a],interior[j]]=[interior[j],interior[a]];}
    let placed=0;
    for(const i of interior){
      if(placed>=2)break;
      if(path[i].t==="start")continue;
      path[i].t="chest";path[i].rt="value";path[i].ra=ra;placed++;
    }
  }
  const isBoss=bi>=0,isFinal=id===50;
  // 特殊Boss关地图适配(地图可在编辑器精调;此处保证生成关可直接游玩)
  if(bi>=0){
    const zz=ZOD[bi];
    if(zz==="兔"){
      // 兔跃(19):Boss孤立在跳跃落点上,只有半径2跳跃能抵达(且不与任何格相邻,防止走上去)
      const last=path[path.length-2]; // 最后一个可走格:玩家站在其上跳跃
      const candidates=JUMPS.filter(([dx,dy])=>
        last.c+dx>=0&&last.c+dx<GRID_SIZE&&last.r+dy>=0&&last.r+dy<GRID_SIZE
      );
      let off=null;
      for(const [dx,dy] of candidates){
        const bc=last.c+dx,br=last.r+dy;
        // 任何其他格(含末格与沿途格)与Boss曼哈顿距离=1 则放弃该落点(会允许走上去)
        const isolated=!path.some((p,i)=>i<path.length-1&&p.c!=null&&Math.abs(p.c-bc)+Math.abs(p.r-br)===1);
        if(isolated){off=[dx,dy];break;}
      }
      if(!off)off=candidates[0]||[2,2];
      path[path.length-1]={c:last.c+off[0],r:last.r+off[1],t:"boss",v:bossV};
    }else if(zz==="龙"){
      // 腾云驾雾(23):Boss前4格为云雾格,踩过云雾(经过1次)才能触发Boss战
      for(let i=Math.max(1,P-4);i<P;i++){
        const q=path[i];if(q&&q.t!=="start"&&q.t!=="boss")path[i]={c:q.c,r:q.r,t:"cloud"};
      }
    }else if(zz==="蛇"){
      // 潜伏(27):近全陷阱格地图,陷阱仅小量损失,降低Boss需求
      for(let i=1;i<P;i++){
        const q=path[i];
        if(q.t==="start")continue;
        path[i]={c:q.c,r:q.r,t:"trap",eff:"value",ra:2};
      }
      path[P].v=8;
    }else if(zz==="羊"){
      // 替罪羊(35):Boss前放3个羊Boss的分身替罪羊,须全部击败才能与Boss战斗
      const interior=[];for(let i=1;i<P;i++)if(path[i].t==="mob")interior.push(i);
      let placed=0;
      for(let a=0;a<interior.length&&placed<3;a++){
        const j=a+Math.floor(rng()*(interior.length-a));[interior[a],interior[j]]=[interior[j],interior[a]];
      }
      for(const i of interior){
        if(placed>=3)break;
        if(path[i].t!=="mob")continue;
        path[i]={c:path[i].c,r:path[i].r,t:"mob",v:path[i].v,scapegoat:true};placed++;
      }
    }else if(zz==="猴"){
      // 分身(39):路径中途放1个分身格,到达后融合才能与猴Boss战斗
      const mid=Math.max(2,Math.floor(P/2));
      const q=path[mid];if(q&&q.t!=="start"&&q.t!=="boss")path[mid]={c:q.c,r:q.r,t:"clone"};
    }else if(zz==="鸡"){
      // 晨鸣(43):路径上放6个沉睡格(2组×3个),全部唤醒才能与鸡Boss战斗
      const interior=[];for(let i=1;i<P;i++)interior.push(i);
      let placed=0;
      for(const i of interior){
        if(placed>=6)break;
        if(path[i].t!=="mob"&&path[i].t!=="gain")continue;
        path[i]={c:path[i].c,r:path[i].r,t:"sleep",v:Math.max(2,Math.round(path[i].v||bossV*0.15))};placed++;
      }
    }else if(zz==="猪"){
      // 拱地(47):需消耗500金币解锁Boss格;路径上放若干金币格供凑500
      let placed=0;
      for(let i=1;i<P&&placed<8;i++){
        const q=path[i];
        if(q.t!=="mob"&&q.t!=="gain")continue;
        path[i]={c:q.c,r:q.r,t:"coin",v:60};placed++;
      }
    }
  }
  return {id:id,gen:true,
    name:isFinal?"年兽·终局":isBoss?("生肖Boss·"+ZOD[bi]):("第 "+id+" 关"),
    sub:(isBoss||isFinal?"Boss战 · ":"")+P+" 步 · 骰子 ×"+D6,
    tutorial:false,size:GRID_SIZE,startVal:4,dice:D6,gain:gainV,path:path,
    meta:{wr:plan.wr,seed:id*7919+13}};
}

// ====== 关卡数据兼容层 ======
// 从地图编辑器导出的完整图(cells)构建遍历链(支持多岔路):
// 主路径沿BFS最短链;主格旁的非主路邻格=绕行入口→分岔 branches=[主路,...绕行],
// 绕行链按邻接结构走到邻回主路(汇合)为止,汇合尾回连最近主路格。线性图返回 null。
function buildForkGraph(cells){
  const n=cells.length;
  const adj=cells.map(()=>[]);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    if(Math.abs(cells[i].c-cells[j].c)+Math.abs(cells[i].r-cells[j].r)===1){adj[i].push(j);adj[j].push(i);}
  }
  const start=cells.findIndex(x=>x.t==="start"),boss=cells.findIndex(x=>x.t==="boss");
  if(start<0||boss<0)return null;
  // BFS 距起点(含父链,用于求主路径)
  const dS=new Array(n).fill(1e9),prev=new Array(n).fill(-1);
  dS[start]=0;const q=[start];
  for(let h=0;h<q.length;h++){const i=q[h];adj[i].forEach(j=>{if(dS[j]>dS[i]+1){dS[j]=dS[i]+1;prev[j]=i;q.push(j);}});}
  if(dS[boss]>=1e9)return null;
  const M=[];for(let c=boss;c!==-1;c=prev[c])M.unshift(c);
  const main=new Set(M);
  if(M.length===n)return null; // 线性图:调用方直接用 cells
  // BFS 距Boss(用于"回连最近主路"排序)
  const dB=new Array(n).fill(1e9);dB[boss]=0;const q2=[boss];
  for(let h=0;h<q2.length;h++){const i=q2[h];adj[i].forEach(j=>{if(dB[j]>dB[i]+1){dB[j]=dB[i]+1;q2.push(j);}});}
  const dbSort=(a,b)=>(dB[a]-dB[b])||(cells[a].r-cells[b].r)||(cells[a].c-cells[b].c);
  cells.forEach(p=>{p.next=[];delete p.branches;});
  const done=new Set();
  // 走绕行链:从入口沿邻接走(不经过主路/已走格),直到邻回主路(汇合)或死胡同
  function walkDetour(entry,parent){
    let cur=entry,from=parent;
    while(true){
      const opts=adj[cur].filter(j=>j!==from&&!done.has(j)&&!main.has(j));
      if(!opts.length)break;
      if(opts.length===1){
        cells[cur].next=[opts[0]];done.add(opts[0]);from=cur;cur=opts[0];continue;
      }
      // 绕行内的子分岔:本格 branches=[主分支,...子分支],各子分支递归走链
      opts.sort(dbSort);
      cells[cur].branches=opts;cells[cur].next=[];
      for(let a=1;a<opts.length;a++){done.add(opts[a]);walkDetour(opts[a],cur);}
      done.add(opts[0]);from=cur;cur=opts[0];
    }
    // 尾格:回连最近主路格(汇合);死胡同则回连距Boss最近的邻格
    const mainN=adj[cur].filter(j=>main.has(j)).sort(dbSort);
    if(mainN.length)cells[cur].next=[mainN[0]];
    else{const best=adj[cur].slice().sort(dbSort)[0];if(best!==undefined)cells[cur].next=[best];}
  }
  // 主路径:主格旁的非主路邻格=绕行入口→分岔
  for(let k=0;k<M.length-1;k++){
    const m=M[k],mnext=M[k+1];
    const off=adj[m].filter(j=>!main.has(j)&&!done.has(j));
    if(off.length){
      cells[m].branches=[mnext,...off];cells[m].next=[];
      off.forEach(o=>{done.add(o);walkDetour(o,m);});
    }else{
      cells[m].next=[mnext];
    }
  }
  return cells;
}
function normalizeLevel(lv){
  lv.size=lv.size||GRID_SIZE;
  // 多层地图检测:存在 >1 种"数字层号"→ 各层独立,禁用线性 next 首尾相连。
  // 注意:部分 boss 格的 z 字段是"生肖立绘标识"(如 "z":"rat"/"z":"dog" 字符串),非层号,必须忽略。
  const zSet=new Set((lv.cells||lv.path||[]).map(p=>(typeof p.z==="number"?p.z:1)));
  const multiLayer=zSet.size>1;
  if(lv.cells&&lv.cells.length>1){
    const g=buildForkGraph(lv.cells);
    if(g)lv.path=g;         // 有分岔:用构建的遍历链
    else lv.path=lv.cells;  // 线性图:直接用 cells
  }
  lv.path=lv.path.map((p,i)=>({
    id:p.id??i,
    t:p.t||"normal",
    // 多层地图不产生跨层线性 next(层间靠传送门);单层保留线性回退
    next:p.next||(!multiLayer&&i<lv.path.length-1?[i+1]:[]),
    ...p
  }));
  lv.path.forEach((p)=>{
    if(p.next) p.next=p.next.map(n=>typeof n==="number"?n:lv.path.findIndex(x=>x.id===n)).filter(n=>n>=0);
    if(p.branches) p.branches=p.branches.map(n=>typeof n==="number"?n:lv.path.findIndex(x=>x.id===n)).filter(n=>n>=0);
  });
  // 把起点格移到数组第0位,并重映射 next/branches 的下标:
  // 使 startLevel 用 idx=0 即从起点格开始(不依赖 startLevel 内部是否被改回 idx=0)
  const si=lv.path.findIndex(p=>p.t==="start");
  if(si>0){
    const n=lv.path.length;
    // 记录旧->新映射:旧si->0,其它>si的下标-1,<si不变
    const remap=arr=>arr.map(idx=>idx===si?0:idx>si?idx-1:idx);
    const newPath=[];let i0=null;
    lv.path.forEach((p,idx)=>{
      const np={...p};
      np.id=idx===si?0:idx>si?idx-1:idx;
      np.next=remap(p.next||[]);
      np.branches=remap(p.branches||[]);
      newPath[idx===si?0:(idx>si?idx-1:idx)]=np;
    });
    lv.path=newPath;
  }
  return lv;
}
function pathEdges(path){
  const edges=[];
  path.forEach((p,i)=>{
    // 只画当前层(curZ)内的连线
    if(pz(p)!==curZ)return;
    const next=(p.branches&&p.branches.length?p.branches:p.next&&p.next.length?p.next:(p.t!=="boss"&&i<path.length-1?[i+1]:[]));
    next.forEach(j=>{
      if(!path[j])return;
      // 与移动邻接一致:仅当物理相邻(同层)才连线,避免把仅靠传送门连通的分区画成直接连线
      if(pz(p)===pz(path[j])&&Math.abs(p.c-path[j].c)+Math.abs(p.r-path[j].r)===1)edges.push([i,j]);
    });
  });
  return edges;
}

const MOB_VARIANTS=["mob1","mob2","mob3"];
const ELITE_VARIANTS=["elite1","elite2"];
function variantFor(seed,arr){return arr[Math.floor(mulberry32(seed)()*arr.length)];}
function mobVariant(id,i){return variantFor(id*131+i*7+11,MOB_VARIANTS);}
function eliteVariant(id,i){return variantFor(id*97+i*13+5,ELITE_VARIANTS);}
// 本关精英格用的那张精英贴图(取第一个精英格;无精英格则默认 elite1)
function levelEliteVariant(){
  const ei=LEVEL.path.findIndex(p=>p.t==="elite");
  return ei>=0?eliteVariant(LEVEL.id,ei):ELITE_VARIANTS[0];
}
// 实体立绘候选链:套图 entities/<name>.svg → 套图 tiles/<name>.svg(兼容 tiles 目录)→ 基础图
function entityCands(name,base){return artChain(['entities/'+name+'.svg','tiles/'+name+'.svg'],base);}

    let cands;

      cands=artChain(z?['entities/boss_'+z+'.svg','tiles/boss_'+z+'.svg']:null,[art,png]);

      </div>`;
    }

  }
  // 平面类型(起点/增益/云雾/沉睡/陷阱/传送门/金币/骰子/岔路):纹理已平铺到整格(tile),内容层只留信息徽章;
  // 立体类型(怪/宝箱/精英):normal 纹理打底 + 立绘竖立在格上(tile-content 已反向旋转,始终正对镜头);
  // 缺图/删图 → 回退CSS实体
  const art=(p.t!=="boss")?ART.tiles[p.t]:null;
  const badge=entityBadgeHTML(p,gainVal);
  if(FLAT_TYPES.includes(p.t)){
    if(p.t==="start") return `<span class="start-mark">起</span>`;
    if(p.t==="cloud") return `<span class="cloud-mark">☁</span>`;
    if(p.t==="sleep"){
      // 沉睡格盲盒:只显示 💤,不显示收益(数值/骰子/金币),苏醒时才揭晓
      return `<span class="sleep-wrap"><span class="sleep-zzz">💤</span><span class="sleep-reward">?</span></span>`;
    }
    if(p.t==="clone"){
      // 分身格:💠 分身标记 + 当前积累值
      const v=cloneMerged?0:cloneVal;
      return `<span class="clone-mark">💠</span><span class="clone-val">${v}</span>`;
    }
    return badge;
  }
  if(art){
    // 立绘:怪→mob1/2/3、精英→elite1/2 稳定随机;分身→avatar;宝箱/传送门→各自贴图。套图 entities/ 或 tiles/ 均可,逐级回退基础图
    let name,cands;
    if(p.t==="mob")name=mobVariant(LEVEL.id,i);
    else if(p.t==="elite")name=eliteVariant(LEVEL.id,i);
    else if(p.t==="clone"){name="avatar";cands=artChain(['entities/avatar.svg','tiles/avatar.svg'],['images/common/avatar.svg',ART.tiles.clone]);}
    else name=p.t;
    if(!cands)cands=entityCands(name,art);
    return `<div class="tile-entity">${chainImg("tile-entity-img",cands)}${badge}</div>`;
  }
  return cssEntityFallback(p,gainVal);
}
function entityBadgeHTML(p,gainVal){

  if(p.t==="elite")return `<div class="mob-val elite">?</div>`;

// 新机制状态:羊替罪羊/猴分身/鸡沉睡/猪拱地
let goatUsed=false,scapegoatsDefeated=0,cloneIdx=-1,cloneVal=0,cloneMerged=false,sleepWoken=0,pigUnlocked=false;
// 多层地图:当前所在层(z)。游戏每次只渲染当前层;跨层传送门切换后重建该层渲染
let curZ=1;
// 层号归一:boss 格的 z 可能是"生肖立绘标识"(字符串,如 "rat"/"dog"),非层号;仅数字视为层号,其余当层1
const pz=p=>{const z=p&&p.z;return typeof z==="number"?z:1;};
const JUMPS=[[-2,2],[-2,0],[-2,-2],[0,2],[0,-2],[2,0],[2,-2],[2,2],[-1,-1],[-1,1],[1,-1],[1,1]]; // 兔跃:轴向/对角2格 + 斜前方1格(曼哈顿2)共12个落点
// 由路径边构建双向邻接表:玩家可沿连接移动到相邻格(供 WASD/点击方向使用)
function buildAdjacency(){
  // 移动邻接 = 所有物理相邻(曼哈顿距离=1)的路径格(双向) + 传送门配对边。
  // 玩家可自由走相邻格(含岔路间/反向移动),这是自由移动设计;
  // 物理不相邻的分区(如仅靠传送门连通的Boss区/多层地图)不会因路径数组顺序被连起来。
  // 多层地图(z):各层坐标独立,物理相邻仅限同层(z相同);层间靠跨层传送门(link.z)连通。
  // 玩家铺的云雾格(isCloud)在"经过后消失"前一直可走;已消失(cloudGone)则不可走
  adj=LEVEL.path.map(()=>new Set());
  for(let i=0;i<LEVEL.path.length;i++){
    if(LEVEL.path[i].cloudGone)continue;
    const a=LEVEL.path[i];
    for(let j=i+1;j<LEVEL.path.length;j++){
      if(LEVEL.path[j].cloudGone)continue;
      const b=LEVEL.path[j];
      if(pz(a)===pz(b)&&Math.abs(a.c-b.c)+Math.abs(a.r-b.r)===1){adj[i].add(j);adj[j].add(i);}
    }
  }
  // 传送门配对边:portal 与其 link(层号+坐标)之间的"传送边"(可跨层)
  LEVEL.path.forEach((p,i)=>{
    if(p.t==="portal"&&p.link&&p.link.c!=null&&p.link.r!=null&&!p.cloudGone){
      const j=LEVEL.path.findIndex(x=>x.c===p.link.c&&x.r===p.link.r&&pz(x)===(p.link.z||1));
      if(j>=0&&j!==i&&!LEVEL.path[j].cloudGone){adj[i].add(j);adj[j].add(i);}
    }
  });
}

function saveToSlot(slot){
  const d={unlocked,coins,weapons:ownedWeapons,wstars:weaponStars,charms:ownedCharms,loadout,bonusDice,ach:[...(achievements||[])]};
  localStorage.setItem("sx_save_"+slot,JSON.stringify(d));

  activeSave=slot;
  // 兼容旧键:同步写一份(供无槽位场景/外部读取)
  localStorage.setItem("sx_unlocked",unlocked);
  localStorage.setItem("sx_coins",coins);
  localStorage.setItem("sx_weapons",JSON.stringify(ownedWeapons));
  localStorage.setItem("sx_charms",JSON.stringify(ownedCharms));
  localStorage.setItem("sx_loadout",JSON.stringify(loadout));
  localStorage.setItem("sx_bonusDice",bonusDice);
}
function loadFromSlot(slot){
  let d=null;
  try{d=JSON.parse(localStorage.getItem("sx_save_"+slot)||"null");}catch(e){d=null;}
  if(!d)return false;
  unlocked=+(d.unlocked||1);
  coins=+(d.coins||0);
  ownedWeapons=Array.isArray(d.weapons)?d.weapons:[];
  weaponStars=(d.wstars&&typeof d.wstars==="object")?JSON.parse(JSON.stringify(d.wstars)):{};
  ownedCharms=Array.isArray(d.charms)?d.charms:[];
  achievements=Array.isArray(d.ach)?d.ach.slice():[];
  loadout=d.loadout||{w:null,c:[null,null,null]};
  if(!Array.isArray(loadout.c))loadout.c=[null,null,null];
  while(loadout.c.length<3)loadout.c.push(null);
  bonusDice=+(d.bonusDice||0);
  localStorage.setItem("sx_active_save",slot);
  activeSave=slot;
  return true;
}
function deleteSlot(slot){
  localStorage.removeItem("sx_save_"+slot);
  if(activeSave===slot){activeSave=0;localStorage.setItem("sx_active_save","0");}
}
function slotSummary(slot){
  try{
    const d=JSON.parse(localStorage.getItem("sx_save_"+slot)||"null");
    if(!d)return null;
    return {unlocked:+(d.unlocked||1),coins:+(d.coins||0),charms:(d.charms||[]).length,weapons:(d.weapons||[]).length};
  }catch(e){return null;}
}

// 当前武器星级(默认1)
function weaponStar(id){return (weaponStars&&weaponStars[id])||1;}
// 商店点击:未拥有→购买;已拥有可升星→升星;否则提示
function shopWeaponAction(id){
  const w=WEAPONS[id];
  if(!ownedWeapons.includes(id)){
    if(coins<w.price){toast("金币不足");return;}
    coins-=w.price;ownedWeapons.push(id);weaponStars[id]=1;saveProg();
    toast("购入 "+w.name+"（1星）");renderShop();return;
  }
  const star=weaponStar(id);
  if(w.maxStars>1&&star<w.maxStars){
    const cost=w.upPrices[star-1];
    if(coins<cost){toast("金币不足升星");return;}
    coins-=cost;weaponStars[id]=star+1;saveProg();
    toast(`${w.name} 升到 ${star+1} 星!`);renderShop();return;
  }
  toast(star>=w.maxStars?`${w.name} 已满星`:w.desc);
}

function prepCharm(id){

  const maxSlots=pendingLevelId===50?12:3; // 第50关(终局)可携带全部符咒;其它关固定3槽
  // 非终局关:loadout.c 若曾被50关撑到>3,先截断只保留前3槽(防止其它关意外携带>3符咒)

  if(sl>=0)loadout.c[sl]=null;
  else{
    // 只在有效的 slots 范围内找空位(非50关=前3,50关=前12)
    let free=-1;
    for(let k=0;k<Math.min(loadout.c.length,maxSlots);k++)if(!loadout.c[k]){free=k;break;}
    if(free<0&&maxSlots>3){// 50关:数组不足12则扩容
      while(loadout.c.length<maxSlots)loadout.c.push(null);
      free=loadout.c.length-maxSlots;

    }

const sfx={
  ctx:null, muted:(localStorage.getItem("ruth_muted")==="1"),
  ensure(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC)this.ctx=new AC();
    }
    if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();
    return this.ctx;
  },
  tone(freq,dur,type,vol,when,slide){
    const c=this.ensure();if(!c||this.muted)return;
    const t=c.currentTime+(when||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+(dur||0.1));
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.1));
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+(dur||0.1)+0.03);
  },
  seq(notes,type,vol){
    notes.forEach((n,i)=>this.tone(n[0],n[1],type,vol,i*0.06));
  },
  roll(){this.seq([[330,.05],[440,.05],[520,.05],[620,.08]],"square",0.1);},
  step(){this.tone(180,.06,"triangle",0.14,0,300);},
  gain(){this.seq([[523,.07],[784,.12]],"triangle",0.15);},
  coin(){this.seq([[880,.06],[1175,.12]],"triangle",0.17);},
  chest(){this.seq([[392,.08],[523,.08],[659,.14]],"triangle",0.15);},
  win(){this.seq([[523,.1],[659,.1],[784,.1],[1047,.22]],"triangle",0.2);},
  lose(){this.seq([[400,.14],[330,.14],[260,.22]],"sawtooth",0.13);},
  click(){this.tone(620,.04,"square",0.07,0,360);},
  toggle(){
    this.muted=!this.muted;
    localStorage.setItem("ruth_muted",this.muted?"1":"0");
    const b=$("muteBtn");if(b)b.textContent=this.muted?"🔇":"🔊";
    if(typeof Music!=="undefined"&&Music.audio)Music.audio.volume=this.muted?0:0.5;
    if(!this.muted)this.click();
  }
};

// 循环播放;缺文件静音;浏览器自动播放限制:需用户首次交互后开始。
const Music={
  audio:null, key:null,
  exts:['mp3','ogg','wav'],
  play(key){
    if(!key){this.stop();return;}
    if(this.key===key&&this.audio&&!this.audio.paused)return;
    this.stop();
    const cands=this.exts.map(e=>'audio/'+key+'.'+e);
    const a=new Audio();
    let tried=0;
    a.onerror=()=>{if(tried<cands.length-1){a.src=cands[++tried];a.play().catch(()=>{});}};
    a.loop=true;a.volume=sfx.muted?0:0.5;
    a.src=cands[0];
    a.play().catch(()=>{});
    this.audio=a;this.key=key;
  },
  stop(){if(this.audio){this.audio.pause();this.audio=null;}this.key=null;},
  unlock(){if(this.key&&this.audio)this.audio.play().catch(()=>{});}
};

function headingR(){
  const cur=LEVEL.path[idx];
  // 优先按"实际移动方向"朝向;初始/未移动时退回沿路径指向Boss的方向
  let dx,dy;
  if(lastMove&&(lastMove.dc||lastMove.dr)){
    dx=lastMove.dc;dy=lastMove.dr;
  }else{
    const nxt=LEVEL.path[peekNextIndex()]||cur;
    dx=nxt.c-cur.c;dy=nxt.r-cur.r;
  }
  if(!dx&&!dy)return lastR;
  let R=-90-Math.atan2(dy,dx)*180/Math.PI;
  while(R-lastR>180)R-=360;
  while(R-lastR<-180)R+=360;
  lastR=R;return R;
}
// —— 镜头(单平面方案) ——
// 主角转向时 #cam 的 rotateZ(R) 与 --nrz 用同一缓动/时长"锁步"过渡(R 恒为 90° 倍数):
// 棋盘在转、实体/主角反向等速抵消,全程正对镜头零倾斜,静止帧=四个 90° 单平面视角之一(无透视变形)。
function camUpdate(){
  const sc=$("scene"),cam=$("cam");
  const cx=sc.clientWidth/2,cy=sc.clientHeight/2,HOFF=sc.clientHeight*0.22;
  // 镜头缩放随 scene 高度自适应:基线640px→ZOOM=1.16,scene 越小棋盘缩得越小(单屏布局下仍完整可见)
  const zs=camZoom(sc);
  const R=headingR(),cur=LEVEL.path[idx];
  cam.style.transform=`translate(${cx}px,${cy}px) translateY(${HOFF}px) scale(${zs}) rotateX(${TILT}deg) rotateZ(${R}deg) translate(${-cur.c*T}px,${-cur.r*T}px)`;
  // --nrz 仅在朝向变化时更新(与 rotateZ 同缓动锁步过渡),直线移动时跳过以免每步触发实体样式重算
  const nrz=(-R)+"deg";
  if(cam._nrz!==nrz){cam._nrz=nrz;cam.style.setProperty("--nrz",nrz);}
}
// 镜头缩放随 scene 高度自适应(供 camUpdate 与 screenToGrid 共用,保证点击坐标换算一致)
function camZoom(sc){
  const h=sc?(sc.clientHeight||640):640;
  return Math.max(0.62,Math.min(1.35,(h/640)*ZOOM));
}

// ====== 2D 俯视地图 ======
function buildMap(){
  const keys={};
  LEVEL.path.forEach((p,i)=>{if(pz(p)===curZ)keys[p.c+","+p.r]=i;});
  mapMin={c:0,r:0};
  const g=$("mapGrid");
  g.style.width=(GRID_SIZE*M)+"px";g.style.height=(GRID_SIZE*M)+"px";
  let html=connectorSVG(LEVEL.path,M,"path-layer map-path");
  for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
    const k=c+","+r,L=c*M,Ty=r*M;
    if(keys[k]===undefined)
      html+=`<div class="mcell w" style="left:${L}px;top:${Ty}px;width:${M}px;height:${M}px"></div>`;
    else{
      const i=keys[k],p=LEVEL.path[i];
      html+=`<div class="mcell ${p.t}" id="m${i}" onclick="tryMoveTo(${i})" style="left:${L}px;top:${Ty}px;width:${M}px;height:${M}px">${mLab(p)}</div>`;
    }
  }
  html+=`<div id="p2"></div>`;
  g.innerHTML=html;
}
function mLab(p){
  if(p.t==="boss")return p.v;
  if(p.t==="mob")return p.v;
  if(p.t==="elite")return "?";
  if(p.t==="gain")return ((p.v??LEVEL.gain)<0?p.v:'+'+(p.v??LEVEL.gain));
  if(p.t==="trap")return "☠";
  if(p.t==="portal")return "⛩";
  if(p.t==="coin")return "★";
  if(p.t==="dice")return "🎲";
  if(p.t==="chest")return "▰";
  if(p.t==="branch")return "";
  if(p.t==="cloud")return "☁";
  if(p.t==="sleep")return "💤";
  if(p.t==="clone")return "💠";
  return "起";
}
function connectorSVG(path,unit,cls){
  const size=GRID_SIZE*unit, edges=pathEdges(path);
  const d=edges.map(([a,b])=>`M ${path[a].c*unit+unit/2} ${path[a].r*unit+unit/2} L ${path[b].c*unit+unit/2} ${path[b].r*unit+unit/2}`).join(" ");
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><path d="${d}"></path><path class="glow" d="${d}"></path></svg>`;
}

// ====== 游戏循环 ======
function roll(){
  if(status!=="playing"||moving||diceLeft<=0)return;
  // 牛符咒提示:掷出最后一颗骰子后,牛符咒将因无骰子可用(需留1骰)
  if(hasCharm("ox")&&!oxUsed&&diceLeft===1)toast("⚠️ 掷出最后一颗骰后,牛符咒将无法使用(牛符咒需留1颗骰子)");
  // 马符咒:本关第一个骰子 与 最后一个骰子 的点数转化为2倍行动点
  if(hasCharm("horse")&&diceLeft===1)horseLast=true;
  diceLeft--;moving=true;
  // 蛇符咒:整局游戏免疫前3个陷阱(开局给3次额度,不随掷骰重置)
  sfx.roll();
  doRoll();
  sync();
}
// 计算一次掷骰结果,处理武器(诅咒/双生/幸运)与Debuff(厄运/迟缓)
// 马符咒在 animateRoll 中把首个骰子点数×2(此处不处理)
function doRoll(){
  let n=1+Math.floor(Math.random()*6);
  if(weapon==="cursed"){
    if(n===6){diceLeft=Math.max(0,diceLeft-1);toast("诅咒骰:掷出6,损失1颗骰子");}
    n+=3;
  }
  if(debuff.badLuck){debuff.badLuck=false;n=Math.min(n,1+Math.floor(Math.random()*3));toast("厄运:本次掷骰 ≤3");}
  if(debuff.slow){debuff.slow=false;n=Math.max(1,n-1);toast("迟缓:本次掷骰 -1");}
  if(weapon==="twin"){
    const n2=1+Math.floor(Math.random()*6);
    const box=$("mbox"),mo=$("modal");
    box.innerHTML=`<h2 style="color:#72c4ff">双 生 骰</h2><p style="color:#94a3b8">一次掷出两个结果,选择其一作为行动点数</p>
      <button class="pri" onclick="pickTwin(${n})">+${n} 行动点</button>
      <button onclick="pickTwin(${n2})">+${n2} 行动点</button>`;
    keepModal=true;
    mo.classList.add("show");
    sync();
    return;
  }
  if(weapon==="lucky"&&n<=2){
    luckyPick=n;
    const box=$("mbox"),mo=$("modal");
    box.innerHTML=`<h2 style="color:#ffd257">幸 运 骰</h2><p style="color:#94a3b8">掷出 ${n} 点 · 可重掷（不限次数）</p>
      <button class="pri" onclick="rerollLucky()">重掷一次</button>
      <button onclick="keepLucky()">保留 ${n} 点</button>`;
    keepModal=true;
    mo.classList.add("show");
    sync();
    return;
  }
  animateRoll(n);
}
// 兔符咒:把1枚骰子转化为1次跳跃机会(一局可多次)
function convertDieToJump(){
  if(!hasCharm("rabbit")){toast("需要兔符咒");return;}
  if(status!=="playing"||moving||diceLeft<=0)return;
  diceLeft--;jumpMode=true;

}
// 切换跳跃模式:优先消耗"自由跳跃"(兔Boss关),其次兔符咒(消耗1骰)
function toggleJump(){
  if(jumpMode){jumpMode=false;freeJumpActive=false;toast("已取消跳跃");sync();return;}
  if(freeJumps>0){

function pickTwin(n){keepModal=false;$("modal").classList.remove("show");animateRoll(n);}
function rerollLucky(){keepModal=false;$("modal").classList.remove("show");doRoll();}
function keepLucky(){keepModal=false;$("modal").classList.remove("show");animateRoll(luckyPick);}
function animateRoll(n){

  const horseDouble=hasCharm("horse")&&(horseFirst||horseLast);

// 向目标格移动1格(消耗1点行动点数),并结算落地效果
function moveTo(i){
  if(status!=="playing"||moving)return;
  if(!adj[idx]||!adj[idx].has(i))return;
  // 死路掉头:当前格只有唯一相邻格(死胡同),退回该格不耗行动点(原路返回,非新探索)
  const deadEndRetreat=adj[idx]&&adj[idx].size===1;
  if(!deadEndRetreat&&ap<=0){toast("行动点数不足,请掷骰子");return;}
  if(!deadEndRetreat)ap--;
  const oi=idx, oc=LEVEL.path[oi], orr=oc.r, occ=oc.c;
  idx=i;
  lastMove={dc:LEVEL.path[idx].c-occ, dr:LEVEL.path[idx].r-orr}; // 相机按实际移动方向朝向(退格/岔路不反向)
  if(tempVal>0)tempVal=Math.max(0,tempVal-(WEAPONS.blade.stepCost[weaponStar("blade")-1]||5)); // 腐朽之刃:每走1格临时数值-星阶
  totalSteps++; // 马跃(31):总行动格数
  // 云雾格"再走一步才消失":离开旧格(oi)且旧格是云雾(未消耗)→ 当场消散,不可再走
  const oj=LEVEL.path[oi];
  if(oj&&oj.t==="cloud"&&!oj.cloudGone){
    oj.cloudGone=true;clearCloudTile(oi);buildAdjacency();
    toast("☁ 云雾消散");
  }
  const tok=$("tok");tok.classList.remove("jump");void tok.offsetWidth;tok.classList.add("jump");
  sfx.step();
  landOn();
  sync();
  // 行动点与骰子都耗尽且未到 Boss:无法再进入新格,判负
  if(status==="playing"&&ap<=0&&diceLeft<=0&&LEVEL.path[idx].t!=="boss"&&!jumpMode){
    endGame(false,`骰子与行动点都已耗尽,距 Boss 还差 ${shortestBossDistance(idx)} 步`);
  }
}
// 兔跃:从当前格跳到半径2格的落点(不消耗行动点,免费传送;龙雾铺出的云雾格也可跳)
function doJump(i){
  if(status!=="playing"||moving)return;
  const cur=LEVEL.path[idx];
  const target=LEVEL.path[i];
  if(target.cloudGone)return;
  const dc=target.c-cur.c,dr=target.r-cur.r;
  if(freeJumpActive){
    // 自由跳跃:以自身为中心、两格内(Chebyshev≤2,含对角)
    if(Math.abs(dc)>2||Math.abs(dr)>2||(dc===0&&dr===0)){toast("自由跳跃:只能在自身两格范围内");return;}
  }else{
    if(!JUMPS.some(([a,b])=>a===dc&&b===dr)){toast("兔跃:只能跳到半径2格的落点");return;}
  }
  // 目标格不可为其他实体/已消耗格——允许落在空(普通/云雾)格;若有怪/Boss由 landOn 处理
  jumpMode=false;
  const oi=idx, oc=cur, orr=oc.r, occ=oc.c;
  idx=i;
  if(freeJumpActive){freeJumps--;freeJumpActive=false;} // 消耗一次自由跳跃
  lastMove={dc:target.c-occ,dr:target.r-orr};
  totalSteps++;
  // 云雾格"再走一步才消失":离开旧格(oi)且旧格是云雾(未消耗)→ 当场消散,不可再走
  const oj=LEVEL.path[oi];
  if(oj&&oj.t==="cloud"&&!oj.cloudGone){
    oj.cloudGone=true;clearCloudTile(oi);buildAdjacency();
    toast("☁ 云雾消散");
  }
  const tok=$("tok");tok.classList.remove("jump");void tok.offsetWidth;tok.classList.add("jump");
  sfx.step();
  toast("🐇 跳跃!");
  landOn();
  sync();
}
// 按网格方向尝试移动 (WASD / 方向键 / 点击方向)
function tryMoveDir(dx,dy){
  const cur=LEVEL.path[idx];
  for(const j of (adj[idx]||[])){
    const p=LEVEL.path[j];
    if(p.c===cur.c+dx&&p.r===cur.r+dy){moveTo(j);return;}
  }
}
// 点击格子:兔跃/龙雾模式下先处理,否则仅当该格相邻(可达)时移动
function tryMoveTo(i){
  if(cloudMode){const p=LEVEL.path[i];if(p)placeCloudAt(p.c,p.r);return;}
  if(jumpMode){doJump(i);return;}
  if(adj[idx]&&adj[idx].has(i))moveTo(i);
}
// 龙符咒:在指定坐标铺一格云雾(可铺在不同位置/不同回合)
function clearCloudTile(i){
  const el=$("t"+i);if(el){el.className="tile";const tc=el.querySelector(".tile-content");if(tc)tc.innerHTML="";}
  const mel=$("m"+i);if(mel){mel.textContent="";mel.className="mcell";}
}
// 龙符咒:在指定网格坐标(c,r)铺一格云雾。
// 已有可铺格 → 转成云雾格;空位 → 新建一个可走的云雾格(连接断开的路径)。
function placeCloudAt(c,r){
  if(cloudsLeft<=0){toast("云雾格已用完");cloudMode=false;sync();return;}
  const z=curZ||1;
  // 仅匹配当前层(z)的同坐标格,避免多层地图误匹配其它层的格子
  const exist=LEVEL.path.findIndex(p=>pz(p)===z&&p.c===c&&p.r===r);
  if(exist>=0){
    const p=LEVEL.path[exist];
    if(p.cloudGone)return;
    if(p.c===LEVEL.path[idx].c&&p.r===LEVEL.path[idx].r&&pz(p)===z){toast("不能铺在当前脚下");return;}
    if(["start","boss","mob","elite","chest","portal","coin","dice"].includes(p.t)){toast("云雾格只能铺在空/增益/陷阱格上");return;}
    p.t="cloud";p.isCloud=true;delete p.cloudGone;
    doneSet.delete(exist);
    const el=$("t"+exist);if(el){el.className="tile t-cloud";const tc=el.querySelector(".tile-content");if(tc)tc.innerHTML=`<span class="cloud-mark">☁</span>`;}
    const mel=$("m"+exist);if(mel){mel.textContent="☁";mel.className="mcell cloud";}
    cloudsLeft--;
    toast(`☁ 已铺云雾格 @(${c},${r}),剩 ${cloudsLeft}`);
  }else{
    // 空位:新建云雾格。须与"玩家当前层可达的任一格"曼哈顿相邻,铺上去才能连上网络(可当桥)。
    let adjOK=false;
    const reach=new Set([idx]),qq=[idx];
    for(let h=0;h<qq.length;h++){const id=qq[h];adj[id].forEach(n=>{if(!reach.has(n)){reach.add(n);qq.push(n);}});}
    for(const ri of reach){const q=LEVEL.path[ri];if(pz(q)===z&&Math.abs(q.c-c)+Math.abs(q.r-r)===1){adjOK=true;break;}}
    if(!adjOK){toast("云雾格需铺在与可达格相邻的空位(才能连上路径)");return;}
    addCloudCell(c,r,z);
    cloudsLeft--;
    toast(`☁ 已新建云雾格 @(${c},${r}),剩 ${cloudsLeft}`);
  }
  if(cloudsLeft<=0)cloudMode=false;
  buildAdjacency();
  sync();
}
// 点击视角地图:朝点击方向移动1步
// 取所有可达(相邻)格中离点击点屏幕位置最近的一格移动,
// 从而天然实现"点主角正前方=向前、点正右方=向右、点左/后方=左退/后退"
// 龙符咒铺云时:把屏幕点击点反算成棋盘网格坐标(在任意空位新建云雾格)
function screenToGrid(e){
  const sc=$("scene");
  if(!sc)return null;
  const rect=sc.getBoundingClientRect();
  const cx=sc.clientWidth/2,cy=sc.clientHeight/2,HOFF=sc.clientHeight*0.22;
  const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
  // 逆平移
  let lx=sx-cx, ly=sy-cy-HOFF;
  // 逆缩放(与 camUpdate 一致的自适应缩放)
  const zs=camZoom(sc);
  lx/=zs; ly/=zs;
  // 逆 rotateX(TILT):棋盘格在 z=0,屏幕 y = ly*cos(TILT)
  ly = ly/Math.cos(TILT*Math.PI/180);
  // 逆 rotateZ(R)
  const R=headingR()*Math.PI/180, c=Math.cos(R), sn=Math.sin(R);
  const gx=lx*c+ly*sn, gy=-lx*sn+ly*c;
  // 加 cur(棋盘 cur 格在局部原点)
  const cur=LEVEL.path[idx];
  const gc=Math.round((gx+cur.c*T)/T), gr=Math.round((gy+cur.r*T)/T);
  if(gc<0||gc>=GRID_SIZE||gr<0||gr>=GRID_SIZE)return null;
  return {c:gc,r:gr};
}
// 3D 场景新增一个可走的云雾格(任意空位,当前层),加入路径并渲染
function addCloudCell(c,r,z){
  const newIdx=LEVEL.path.length;
  LEVEL.path.push({c,r,z:z||curZ||1,t:"cloud",isCloud:true});
  const cam=$("cam");
  const div=document.createElement("div");
  div.className="tile t-cloud";
  div.id="t"+newIdx;
  div.style.cssText=`left:${c*T-TW/2}px;top:${r*T-TW/2}px`;
  div.innerHTML=`<div class="tile-shadow"></div><div class="tile-content"><span class="cloud-mark">☁</span></div>`;
  cam.appendChild(div);
  buildAdjacency();
  return newIdx;
}
function sceneClick(e){
  if(status!=="playing"||moving)return;
  const sc=$("scene");
  if(!sc||sc.style.display==="none")return;
  if(cloudMode){
    // 龙符咒铺云:点击屏幕任一点 → 反算网格坐标,在空位新建云雾格(可连接断开的路径)
    const g=screenToGrid(e);
    if(g)placeCloudAt(g.c,g.r);
    return;
  }
  if(jumpMode){
    // 跳跃:选点击处最近的空格
    let best=-1,bestD=1e18;
    for(let j=0;j<LEVEL.path.length;j++){
      const el=$("t"+j);if(!el)continue;
      const r=el.getBoundingClientRect();
      const d=Math.hypot(r.left+r.width/2-e.clientX, r.top+r.height/2-e.clientY);
      if(d<bestD){bestD=d;best=j;}
    }
    if(best>=0)doJump(best);
    return;
  }
  let best=-1,bestD=1e18;
  for(const j of (adj[idx]||[])){
    const el=$("t"+j);if(!el)continue;
    const r=el.getBoundingClientRect();
    const d=Math.hypot(r.left+r.width/2-e.clientX, r.top+r.height/2-e.clientY);
    if(d<bestD){bestD=d;best=j;}
  }
  if(best>=0)moveTo(best);
}
// 落地效果:根据格子类型结算
function landOn(){
  const p=LEVEL.path[idx];
  // 已消耗的一次性格子(增益/宝箱/怪/金币/骰子)重复经过不再触发;
  // 回起点陷阱(eff==="start")永不失效:即使意外进了 doneSet 也不拦截,反复触发
  if(p.t!=="boss"&&doneSet.has(idx)&&!(p.t==="trap"&&p.eff==="start"))return;
  if(p.t==="cloud"){
    // 云雾格:踩上计数一次(不消失),走到下一格时才消失(玩家可正常站在云上继续走)
    if(!doneSet.has(idx)){
      doneSet.add(idx);
      cloudsCrossed++;
      float3(idx,"☁ 云雾");sfx.gain();
      toast(`☁ 穿过云雾(本局已跨 ${cloudsCrossed} 朵)`);
    }
  }else if(p.t==="gain"){
    const g=p.v??LEVEL.gain;
    val+=g;doneSet.add(idx);float3(idx,(g<0?g:'+'+g));sfx.gain();
    popTile(idx);bumpHeroVal();cloneSync(g);
    announce(`<span class="an-ico">${g<0?"☠":"▲"}</span><span>${g<0?"陷阱数值":"增益"} ${g<0?g:'+'+g}<div class="an-sub">当前 ${effVal()}</div></span>`,g<0?"lose":"gain");
  }else if(p.t==="portal"){
    // 传送门:免费传到配对门(可跨层,link.z 指定目标层),目标格效果由 landOn 递归触发
    if(p.link&&p.link.c!=null&&teleportDepth<3){
      const ti=LEVEL.path.findIndex(x=>x.c===p.link.c&&x.r===p.link.r&&pz(x)===(p.link.z||1));
      if(ti>=0&&ti!==idx){
        const prevZ=pz(LEVEL.path[idx]), nextZ=pz(LEVEL.path[ti]);
        teleportDepth++;
        toast("⛩ 传送门！"+((prevZ!==nextZ)?`(层${prevZ}→层${nextZ})`:""));sfx.step();
        idx=ti;lastMove=null;
        // 跨层切换:重建当前层渲染
        if(prevZ!==nextZ){curZ=nextZ;build3();buildMap();}
        landOn();
        teleportDepth--;
      }else{toast("⛩ 传送门未配对或目标无效");}

    const why=need===p.v
      ?`Boss 需要 ${need},你只有 ${bc.base}${hasCharm("dog")?`（狗符咒加成后 ${cv}）`:""}`
      :`${zz==="鼠"?"鼠Boss":zz==="牛"?"牛Boss":"Boss"} 需要 ${need}${zz==="鼠"?`（初始${p.v}+成长${bossGrowth}）`:""},你只有 ${bc.base}${hasCharm("dog")?`（狗符咒加成后 ${cv}）`:""}`;

    if(!cloneMerged){

      const sleepReward=(si,mult)=>{
        const sp=LEVEL.path[si];
        const rt=sp.rt||"value";
        const raw=sp.ra!=null?sp.ra:(sp.v!=null?sp.v:(rt==="dice"?1:rt==="coin"?10:LEVEL.gain));

        else if(rt==="coin"){coins+=amt;saveProg();$("coinVal").textContent=coins;float3(si,"💰 +"+amt+"金");}
        else{val+=amt;bumpHeroVal();float3(si,"+"+amt);cloneSync(amt);}
        return {rt,amt,label:rt==="dice"?`🎲+${amt}骰`:rt==="coin"?`💰+${amt}金`:`+${amt}`};
      };
      const roosterBonus=hasCharm("rooster")?2:1; // 鸡符咒:仍集满3个才苏醒,苏醒收益×2(200%)
      sleepPending.push(idx);

      if(sleepPending.length>=3){
        const batch=sleepPending.splice(0,3);
        const parts=batch.map(si=>sleepReward(si,roosterBonus).label);
        sleepWoken+=3;

function applyDebuff(i,idx){
  const pool=["slow","weaken","poor","badluck","greed","lost","coward"];
  // idx=1~7 指定某一种诅咒(编辑器人工设定), 否则随机
  const d=idx>=1&&idx<=7?pool[idx-1]:pool[Math.floor(Math.random()*pool.length)];
  const name={slow:"迟缓",weaken:"虚弱",poor:"破财",badluck:"厄运",greed:"贪婪诅咒",lost:"迷失",coward:"怯战"}[d];
  const desc={slow:"下次掷骰 -1",weaken:"当前数值 -20%",poor:"金币 -20",badluck:"下次掷骰 ≤3",greed:"下个击败的敌人收益 -50%",lost:"下次分叉随机选路",coward:"遭遇Boss数值 -15%"}[d];
  if(d==="slow")debuff.slow=true;
  else if(d==="weaken")val=Math.round(val*0.8);
  else if(d==="poor"){coins=Math.max(0,coins-20);saveProg();$("coinVal").textContent=coins;}
  else if(d==="badluck")debuff.badLuck=true;
  else if(d==="greed")debuff.greed=true;
  else if(d==="lost")debuff.lost=true;
  else if(d==="coward")debuff.coward=true;
  toast(`诅咒宝箱:${name} — ${desc}`);
  float3(i,"☠ 诅咒");
  announce(`<span class="an-ico">☠</span><span>诅咒 · ${name}<div class="an-sub">${desc}</div></span>`,"lose");
}

function announce(html,cls,dur){
  const a=$("announce");
  a.className=cls||"";a.innerHTML=`<div class="abox">${html}</div>`;
  clearTimeout(a._t);
  a._t=setTimeout(()=>{a.classList.add("leave");setTimeout(()=>{a.classList.remove("leave");a.innerHTML="";},320);},dur||1250);
}

// 战斗比对横幅:显示"我方数值 vs 敌方数值 → 胜/败",并给敌方格子上胜负光晕
function showBattle(cv,ev,label,win,calc){
  const tag=label==="boss"?"👹":label==="精英"?"⚡":"💀";
  const res=win?"胜!":"败";
  const calcStr=(calc&&calc.length)?calc.join(" → ")+" · "+res:"→ "+res;
  announce(`<span class="an-ico">${tag}</span><span>你的 ${cv} <b style="opacity:.55">vs</b> ${label} ${ev}<div class="an-sub">${calcStr}</div></span>`,win?"win":"lose",win?1600:2000);
  const el=$("t"+idx);
  if(el){el.classList.remove("fight-win","fight-lose");void el.offsetWidth;el.classList.add(win?"fight-win":"fight-lose");}

function peekNextIndex(){return nextIndex(true)??idx;}
function nextIndex(peek=false){
  const p=LEVEL.path[idx];
  if(p.branches&&p.branches.length){
    if(branchChoices[idx]!=null)return branchChoices[idx];
    return peek?p.branches[0]:null;
  }
  return p.next&&p.next.length?p.next[0]:null;
}
function shortestBossDistance(from){return shortestNodeDistance(from,lastIdx);}
function shortestNodeDistance(from,to){
  if(from===to)return 0;
  const q=[[from,0]],seen=new Set([from]);
  while(q.length){
    const [i,d]=q.shift();
    for(const n of adj[i]){
      if(n===to)return d+1;
      if(!seen.has(n)){seen.add(n);q.push([n,d+1]);}
    }
  }
  return 99;
}

// ====== 键盘移动 (WASD / 方向键) ======
// 以相机当前朝向为基准:W=视角前方,S=后方,A=左转方向,D=右转方向。
// 相机绕 Z 轴旋转了 R,把屏幕方向按 -R 逆向旋转回网格方向即可。
function cameraMove(sx,sy){
  const R=lastR*Math.PI/180,cos=Math.cos(R),sin=Math.sin(R);
  const dx=Math.round(cos*sx+sin*sy);
  const dy=Math.round(-sin*sx+cos*sy);
  tryMoveDir(dx,dy);
}
document.addEventListener("keydown",(e)=>{
  if(status!=="playing")return;
  if(e.target&&/input|textarea|select/i.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  // 弹窗打开时:屏蔽移动/掷骰键;数字1/N 选第N行选项,空格/回车 = 确定(点主按钮)
  const modal=$("modal");
  if(modal&&modal.classList.contains("show")){
    const mbox=$("mbox");
    const btns=mbox?[...mbox.querySelectorAll("button")]:[];
    if(/^[1-9]$/.test(k)){
      const idx=+k-1;
      if(btns[idx]){e.preventDefault();btns[idx].click();return;}
    }
    if(k===" "||k==="spacebar"||k==="enter"){
      e.preventDefault();
      const pri=mbox&&mbox.querySelector(".pri");
      if(pri)pri.click();
    }
    return;
  }
  if(k==="w"||k==="arrowup"){e.preventDefault();cameraMove(0,-1);}
  else if(k==="s"||k==="arrowdown"){e.preventDefault();cameraMove(0,1);}
  else if(k==="a"||k==="arrowleft"){e.preventDefault();cameraMove(-1,0);}
  else if(k==="d"||k==="arrowright"){e.preventDefault();cameraMove(1,0);}
  else if(k===" "||k==="spacebar"){e.preventDefault();roll();}
});
