<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>十二生肖 BOSS · Low Poly 模型库（H5）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;
            font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            overflow:hidden}
  #scene{position:fixed;inset:0;display:block}
  .top{position:fixed;top:0;left:0;right:0;padding:10px 12px;pointer-events:none;
       background:linear-gradient(180deg,rgba(11,18,32,.85),transparent);z-index:5}
  .top h1{margin:0;font-size:13px;letter-spacing:2px;color:#94a3b8;font-weight:600}
  .top p{margin:4px 0 0;font-size:11px;color:#64748b;line-height:1.55}
  .controls{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:6;
            display:flex;flex-direction:column;gap:8px}
  .controls button{background:rgba(30,41,59,.85);border:1px solid #334155;color:#e2e8f0;
                   padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;
                   backdrop-filter:blur(6px);min-width:96px;text-align:left}
  .controls button:hover{background:rgba(51,65,85,.95);border-color:#475569}
  .controls button.on{background:#1d4ed8;border-color:#3b82f6}
  .legend{position:fixed;bottom:8px;left:0;right:0;text-align:center;
          font-size:10px;color:#475569;letter-spacing:1px;z-index:5;pointer-events:none}
  .name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(-110px);
        padding:6px 14px;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:18px;
        font-size:13px;font-weight:700;color:#fbbf24;letter-spacing:3px;pointer-events:none;
        opacity:0;transition:opacity .3s;backdrop-filter:blur(4px);white-space:nowrap}
  .name.show{opacity:1}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
           background:#0b1220;z-index:99;color:#64748b;font-size:14px;letter-spacing:2px;
           transition:opacity .4s}
  .loading.hide{opacity:0;pointer-events:none}
  @media (max-width:560px){
    .controls{right:6px;top:auto;bottom:60px;transform:none}
    .controls button{padding:6px 10px;font-size:11px;min-width:84px}
    .top h1{font-size:12px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="top">
  <h1>十二生肖 · BOSS · LOW POLY</h1>
  <p>4×3 阵列 · 点击 BOSS 聚焦查看 · 拖拽旋转 · 滚轮缩放 · 按钮控制</p>
</div>
<div class="controls">
  <button id="btnReset">↺ 重置视角</button>
  <button id="btnAuto">▶ 自动旋转</button>
  <button id="btnRandom">🎲 随机震一下</button>
  <button id="btnPNG">📷 截屏 PNG</button>
  <button id="btnCode">{ } 导出代码</button>
</div>
<div class="legend">R · 重置  |  A · 自动旋转  |  S · 截屏  |  双击空白取消聚焦</div>
<div class="name" id="nameTag"></div>
<div class="loading" id="loading">载入模型中 · LOADING</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   通用工具 —— 把这些函数一起拷到游戏里就能复用全部 12 BOSS
   ============================================================ */

const COL = {
  // 鼠
  rat:        0x8b8b9e, ratDark: 0x6a6a7a,
  // 牛
  ox:         0x7a4a3a, oxDark: 0x5a3528,
  // 虎
  tiger:      0xe87a2c, tigerBlack: 0x1a1a1a, tigerBelly: 0xfff2dc,
  // 兔
  rabbit:     0xf5ede0, rabbitInner: 0xffc8d8,
  // 龙
  dragon:     0x4fc7e0, dragonBelly: 0xeaf6f8, dragonGold: 0xd4a849,
  // 蛇
  snake:      0x6b3aa0, snakeDark: 0x4a2470, snakeBelly: 0xc89af0,
  // 马
  horse:      0xa83838, horseDark: 0x701e1e, horseMane: 0xff6b35,
  // 羊
  sheep:      0xf3ecd9, sheepHorn: 0x3b2618, sheepIce: 0x6cd4f7,
  // 猴
  monkey:     0xc9925a, monkeyFace: 0xf3c794, monkeyArmor: 0xc23a3a,
  // 鸡
  roosterBody:0xc94238, roosterBody2: 0x2464b8, roosterComb: 0xe63850,
  // 狗
  dog:        0xd9a36b, dogDark: 0x8a5a3a, dogScarf: 0xc0382e,
  // 猪
  pig:        0xf4b6b4, pigDark: 0xd28a88, pigArmor: 0xb8843a,
  // 公共
  gold:       0xd4a849, goldLite: 0xf6d77a,
  stone:      0x5a5e6e, stoneDark: 0x3a3e4d, grass: 0x3a8a4a,
  eye:        0x111111, eyeHi: 0xffffff
};

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, flatShading: true,
    metalness: opts.metal ?? 0.15,
    roughness: opts.rough ?? 0.78,
    emissive: opts.em ?? 0x000000,
    emissiveIntensity: opts.ei ?? 0
  });
}
function box(w, h, d, color, opts) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
}
function cone(r, h, segs, color, opts) {
  return new THREE.Mesh(new THREE.ConeGeometry(r, h, segs || 6), mat(color, opts));
}
function sph(r, color, opts) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 6, 5), mat(color, opts));
}
function cyl(rt, rb, h, segs, color, opts) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs || 8), mat(color, opts));
}
function tor(r, t, segs, color, opts) {
  return new THREE.Mesh(new THREE.TorusGeometry(r, t, segs || 5, segs ? segs * 2 : 12), mat(color, opts));
}
// 低多边形宝石/晶簇
function gem(s, color, opts) {
  return new THREE.Mesh(new THREE.OctahedronGeometry(s, 0), mat(color, { ...opts, metal: 0.3, rough: 0.3, em: color, ei: 0.4 }));
}

// 眼睛通用组件
function eyes(x, y, z, dir = 1) {
  const g = new THREE.Group();
  const eL = sph(0.06, COL.eye); eL.position.set(x - 0.08, y, z); eL.scale.z = 1.3;
  const eR = sph(0.06, COL.eye); eR.position.set(x + 0.08, y, z); eR.scale.z = 1.3;
  const hL = sph(0.022, COL.eyeHi); hL.position.set(x - 0.07, y + 0.04, z + 0.06);
  const hR = sph(0.022, COL.eyeHi); hR.position.set(x + 0.07, y + 0.04, z + 0.06);
  g.add(eL, eR, hL, hR);
  return g;
}

/* ============================================================
   底盘 —— 全部 BOSS 共享，参考图里的六边形石台 + 金边
   ============================================================ */
function pedestal() {
  const g = new THREE.Group();
  // 顶层石板（六棱柱）
  const top = cyl(1.55, 1.55, 0.32, 6, COL.stone);
  top.position.y = -0.16;
  // 中层收腰
  const mid = cyl(1.75, 1.85, 0.5, 6, COL.stoneDark);
  mid.position.y = -0.55;
  // 金边
  const rim = cyl(1.87, 1.87, 0.12, 6, COL.gold, { metal: 0.7, rough: 0.35 });
  rim.position.y = -0.85;
  // 底座
  const bot = cyl(2.1, 2.1, 0.4, 6, COL.stoneDark);
  bot.position.y = -1.1;
  // 草地小圈点缀
  const grass = cyl(2.05, 2.05, 0.04, 8, COL.grass);
  grass.position.y = 0.01;
  // 几块碎石头
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + 0.4;
    const r = 1.95;
    const s = box(0.3 + Math.random() * 0.2, 0.18, 0.3 + Math.random() * 0.2, COL.stoneDark);
    s.position.set(Math.cos(a) * r, 0.07, Math.sin(a) * r);
    s.rotation.y = Math.random() * Math.PI;
    g.add(s);
  }
  g.add(top, mid, rim, bot, grass);
  return g;
}

/* ============================================================
   1. 子 · 鼠  ——  金盔鼠将 + 红披风 + 金箍棒
   ============================================================ */
function makeBoss_Rat() {
  const g = new THREE.Group();
  // 身体
  const body = box(0.85, 0.7, 1.05, COL.rat);
  body.position.set(0, 0.75, 0);
  // 肚子点缀（浅色胸毛）
  const belly = box(0.5, 0.55, 0.5, 0xb8b8c8);
  belly.position.set(0, 0.7, 0.45);
  // 头
  const head = box(0.62, 0.55, 0.55, COL.rat);
  head.position.set(0, 1.35, 0.45);
  // 大耳朵
  const ear = (sx) => {
    const e = box(0.22, 0.36, 0.06, COL.rat); e.position.set(sx * 0.28, 1.7, 0.42);
    const inner = box(0.14, 0.26, 0.04, 0xdd8898); inner.position.set(sx * 0.28, 1.7, 0.46);
    return [e, inner];
  };
  const ears = [].concat(...[-1, 1].map(ear));
  // 鼻吻
  const snout = box(0.28, 0.2, 0.16, 0xdd8898);
  snout.position.set(0, 1.2, 0.78);
  const nose = sph(0.04, 0x440000); nose.position.set(0, 1.22, 0.88);
  // 头盔
  const helmet = box(0.66, 0.34, 0.58, COL.gold, { metal: 0.7, rough: 0.3 });
  helmet.position.set(0, 1.55, 0.45);
  // 盔顶
  const helmTop = box(0.5, 0.18, 0.5, COL.gold, { metal: 0.7, rough: 0.3 });
  helmTop.position.set(0, 1.78, 0.45);
  // 红缨
  const plume = cone(0.13, 0.45, 5, 0xdc2a2a);
  plume.position.set(0, 2.12, 0.45);
  // 红披风（背后）
  const cape = box(0.7, 0.95, 0.05, 0xc02020);
  cape.position.set(0, 1.0, -0.55);
  cape.rotation.x = -0.18;
  // 长尾巴
  const tail = cyl(0.08, 0.05, 1.2, 6, COL.rat);
  tail.position.set(0, 0.65, -0.8);
  tail.rotation.x = -1.1;
  const tailTip = cyl(0.06, 0.04, 0.4, 6, COL.rat);
  tailTip.position.set(0, 0.25, -1.1);
  tailTip.rotation.x = -0.6;
  // 金箍棒（斜插背后）
  const staff = cyl(0.06, 0.06, 1.6, 6, COL.gold, { metal: 0.85, rough: 0.2 });
  staff.position.set(0.55, 0.9, 0.3);
  staff.rotation.z = -0.35;
  staff.rotation.x = -0.1;
  const staffHead = box(0.18, 0.18, 0.18, COL.gold, { metal: 0.85, rough: 0.2 });
  staffHead.position.set(0.95, 1.7, 0.3);
  // 眼睛
  const e = eyes(0, 1.45, 0.72);

  g.add(body, belly, head, snout, nose, ...ears, helmet, helmTop, plume, cape, tail, tailTip, staff, staffHead, e);
  return g;
}

/* ============================================================
   2. 丑 · 牛  ——  牛魔战甲 + 牛角 + 鼻环 + 锁链
   ============================================================ */
function makeBoss_Ox() {
  const g = new THREE.Group();
  // 巨大身躯
  const body = box(1.7, 1.3, 1.9, COL.ox);
  body.position.set(0, 0.85, 0);
  // 头
  const head = box(0.95, 0.95, 0.95, COL.ox);
  head.position.set(0, 1.6, 0.65);
  // 鼻吻
  const snout = box(0.55, 0.5, 0.45, COL.oxDark);
  snout.position.set(0, 1.3, 1.05);
  // 鼻环
  const ring = tor(0.15, 0.04, 4, COL.gold, { metal: 0.85, rough: 0.2 });
  ring.position.set(0, 1.25, 1.28);
  // 牛角（外弯的锥）
  const horn = (sx) => {
    const h = cone(0.16, 0.9, 5, 0xf0e3c2);
    h.position.set(sx * 0.5, 2.05, 0.55);
    h.rotation.z = sx * 0.55;
    h.rotation.x = -0.25;
    return h;
  };
  // 额甲金边
  const frill = box(0.85, 0.32, 0.18, COL.gold, { metal: 0.7, rough: 0.3 });
  frill.position.set(0, 1.85, 0.95);
  // 红胸甲
  const breast = box(1.5, 0.55, 0.15, 0xb02020);
  breast.position.set(0, 1.15, 0.95);
  const breastG = box(1.5, 0.12, 0.18, COL.gold, { metal: 0.7, rough: 0.3 });
  breastG.position.set(0, 1.45, 0.96);
  // 肩甲
  const pad = (sx) => {
    const p = box(0.5, 0.4, 0.5, 0xb02020);
    p.position.set(sx * 0.95, 1.55, 0.25);
    return p;
  };
  const pads = [-1, 1].map(pad);
  // 锁链（两段环）
  const link1 = tor(0.22, 0.05, 4, 0x888888, { metal: 0.8, rough: 0.3 });
  link1.position.set(0.7, 0.85, 0.95);
  link1.rotation.y = Math.PI / 2;
  const link2 = tor(0.18, 0.05, 4, 0x888888, { metal: 0.8, rough: 0.3 });
  link2.position.set(0.95, 0.7, 0.7);
  link2.rotation.set(0.3, 0.5, -0.4);
  // 4 条腿
  const leg = (x, z) => {
    const l = box(0.35, 0.7, 0.35, COL.oxDark);
    l.position.set(x, 0.35, z);
    return l;
  };
  const legs = [
    leg(-0.55, 0.7), leg(0.55, 0.7),
    leg(-0.55, -0.7), leg(0.55, -0.7)
  ];
  const e = eyes(0, 1.7, 1.12);

  g.add(body, head, snout, ring, [horn(-1), horn(1)], frill, breast, breastG, ...pads, link1, link2, ...legs, e);
  return g;
}

/* ============================================================
   3. 寅 · 虎  ——  黄色条纹虎 + 红布
   ============================================================ */
function makeBoss_Tiger() {
  const g = new THREE.Group();
  // 身躯
  const body = box(1.4, 0.9, 1.9, COL.tiger);
  body.position.set(0, 0.7, 0);
  // 黑条纹
  for (let i = 0; i < 3; i++) {
    const s = box(1.45, 0.12, 0.04, COL.tigerBlack);
    s.position.set(0, 0.75 + i * 0.22, 0.95);
    g.add(s);
    const sb = box(1.45, 0.12, 0.04, COL.tigerBlack);
    sb.position.set(0, 0.75 + i * 0.22, -0.95);
    g.add(sb);
  }
  // 白色腹部
  const belly = box(0.7, 0.7, 1.8, COL.tigerBelly);
  belly.position.set(0, 0.7, 0);
  // 头
  const head = box(0.95, 0.85, 0.85, COL.tiger);
  head.position.set(0, 1.35, 0.95);
  // 鼻吻
  const snout = box(0.5, 0.4, 0.35, COL.tigerBelly);
  snout.position.set(0, 1.05, 1.45);
  // 耳
  const ear = (sx) => {
    const e = cone(0.18, 0.32, 4, COL.tiger);
    e.position.set(sx * 0.4, 1.85, 0.95);
    e.rotation.z = sx * 0.4;
    const inner = cone(0.1, 0.2, 4, 0x332222);
    inner.position.set(sx * 0.45, 1.85, 1.0);
    inner.rotation.z = sx * 0.4;
    return [e, inner];
  };
  const ears = [].concat(...[-1, 1].map(ear));
  // 红色前额装饰
  const frill = box(0.55, 0.12, 0.05, 0xdc2a2a);
  frill.position.set(0, 1.7, 1.2);
  // 长尾巴（向上翘）
  const tail = cyl(0.1, 0.08, 1.4, 6, COL.tiger);
  tail.position.set(0, 0.95, -1.15);
  tail.rotation.x = 1.2;
  const tailTip = box(0.18, 0.18, 0.05, COL.tigerBelly);
  tailTip.position.set(0, 1.65, -0.45);
  tailTip.rotation.x = 0.4;
  // 4 腿
  const leg = (x, z) => {
    const l = box(0.32, 0.8, 0.32, COL.tiger);
    l.position.set(x, 0.4, z);
    return l;
  };
  const legs = [
    leg(-0.45, 0.75), leg(0.45, 0.75),
    leg(-0.45, -0.75), leg(0.45, -0.75)
  ];
  // 红布
  const scarf = box(0.4, 0.6, 0.04, 0xb02020);
  scarf.position.set(0, 1.4, 1.5);
  // 绿色叶饰
  const leaf = (x, y, z, rot) => {
    const l = cone(0.2, 0.45, 4, COL.grass);
    l.position.set(x, y, z); l.rotation.z = rot; l.rotation.x = -0.4;
    return l;
  };
  g.add(body, belly, head, snout, ...ears, frill, tail, tailTip, ...legs, scarf,
        leaf(-0.7, 1.55, 0.65, -0.5), leaf(0.7, 1.55, 0.65, 0.5),
        ...eyes(0, 1.45, 1.35).children);
  return g;
}

/* ============================================================
   4. 卯 · 兔  ——  月兔法师 + 长耳 + 绿斗篷 + 月牙杖
   ============================================================ */
function makeBoss_Rabbit() {
  const g = new THREE.Group();
  // 圆身子
  const body = box(0.9, 0.85, 0.95, COL.rabbit);
  body.position.set(0, 0.85, 0);
  // 头
  const head = sph(0.5, COL.rabbit);
  head.position.set(0, 1.5, 0.1);
  // 长耳朵
  const ear = (sx) => {
    const e = box(0.14, 0.85, 0.06, COL.rabbit);
    e.position.set(sx * 0.18, 2.05, 0.05);
    e.rotation.z = sx * 0.15;
    const inner = box(0.08, 0.7, 0.04, COL.rabbitInner);
    inner.position.set(sx * 0.2, 2.05, 0.08);
    inner.rotation.z = sx * 0.15;
    return [e, inner];
  };
  const ears = [].concat(...[-1, 1].map(ear));
  // 圆脸+腮红
  const cheek = (sx) => {
    const c = sph(0.1, 0xffb6c1);
    c.position.set(sx * 0.32, 1.4, 0.42);
    return c;
  };
  // 鼻
  const nose = sph(0.05, 0xdd6688);
  nose.position.set(0, 1.42, 0.62);
  // 绿斗篷（帽兜状）
  const hood = box(0.85, 0.55, 0.85, 0x2f8c4a);
  hood.position.set(0, 1.45, 0.1);
  const cap = box(0.7, 0.45, 0.7, 0x2f8c4a);
  cap.position.set(0, 1.85, 0.1);
  // 长摆
  const cape = box(0.9, 1.0, 0.1, 0x2f8c4a);
  cape.position.set(0, 0.7, -0.5);
  // 月牙法杖：用两个对扣的圆锥拼出月牙
  const staff = cyl(0.05, 0.05, 1.7, 6, 0xc8a050, { metal: 0.7 });
  staff.position.set(0.55, 0.95, 0.3);
  staff.rotation.z = -0.2;
  // 月牙（一个拉长的环 arc）
  const moonShape = new THREE.Shape();
  moonShape.absarc(0, 0, 0.22, 0.2, Math.PI - 0.2, false);
  moonShape.absarc(0.05, 0, 0.16, Math.PI - 0.2, 0.2, true);
  const moonGeo = new THREE.ExtrudeGeometry(moonShape, { depth: 0.08, bevelEnabled: false });
  const moon = new THREE.Mesh(moonGeo, mat(0xd0e8c0, { metal: 0.6, em: 0xa8e8b0, ei: 0.5 }));
  moon.position.set(0.85, 1.95, 0.3);
  moon.rotation.z = 0.3;
  // 短尾
  const tail = sph(0.18, COL.rabbit);
  tail.position.set(0, 0.7, -0.5);

  g.add(body, head, ...ears, [cheek(-1), cheek(1)], nose, hood, cap, cape, staff, moon, tail,
        ...eyes(0, 1.55, 0.55).children);
  return g;
}

/* ============================================================
   5. 辰 · 龙  ——  青白祥龙 + 龙角 + 龙珠 + 云
   ============================================================ */
function makeBoss_Dragon() {
  const g = new THREE.Group();
  // 龙身（多段串起来 S 形）
  const segs = [];
  const path = [];
  for (let i = 0; i < 5; i++) {
    const t = i / 4;
    const x = Math.sin(t * Math.PI) * 0.9;
    const y = 0.55 + Math.sin(t * Math.PI) * 0.6;
    const z = 0.55 - t * 0.6;
    path.push({ x, y, z });
  }
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    const r = 0.42 - i * 0.04;
    const seg = sph(r + 0.1, COL.dragon);
    seg.scale.set(1.1, 0.95, 1.0);
    seg.position.set(p.x, p.y, p.z);
    segs.push(seg);
    // 腹白
    const bel = box(0.5, 0.15, 0.5, COL.dragonBelly);
    bel.position.set(p.x, p.y - 0.15, p.z);
    g.add(bel);
  }
  // 龙头（最前段放大）
  const head = box(0.75, 0.7, 0.75, COL.dragon);
  head.position.set(path[path.length - 1].x, path[path.length - 1].y + 0.15, path[path.length - 1].z + 0.3);
  // 龙角
  const horn = (sx) => {
    const h = cone(0.1, 0.5, 5, COL.dragonGold, { metal: 0.7 });
    h.position.set(path[path.length - 1].x + sx * 0.25, head.position.y + 0.55, path[path.length - 1].z + 0.3);
    h.rotation.z = sx * -0.4;
    return h;
  };
  // 龙须
  const whi = cyl(0.03, 0.02, 0.6, 5, COL.dragonBelly);
  whi.position.set(head.position.x - 0.1, head.position.y - 0.2, head.position.z + 0.5);
  whi.rotation.x = -0.7;
  whi.rotation.z = 0.5;
  const whi2 = whi.clone(); whi2.position.x = head.position.x + 0.1; whi2.rotation.z = -0.5;
  // 龙嘴
  const jaw = box(0.5, 0.15, 0.2, COL.dragonBelly);
  jaw.position.set(head.position.x, head.position.y - 0.3, head.position.z + 0.55);
  // 龙珠（最前，金光）
  const orb = gem(0.22, COL.gold, { em: 0xffaa44, ei: 0.8, metal: 0.85, rough: 0.15 });
  orb.position.set(head.position.x, head.position.y - 0.5, head.position.z + 0.85);
  // 翅膀
  const wing = (sx) => {
    const w = box(0.7, 0.4, 0.05, COL.dragon);
    w.position.set(head.position.x + sx * 0.7, head.position.y + 0.3, path[path.length - 1].z - 0.1);
    w.rotation.z = sx * -0.4;
    w.rotation.x = 0.3;
    return w;
  };
  // 尾巴尖
  const tailTip = cone(0.15, 0.5, 5, COL.dragon);
  tailTip.position.set(path[0].x, path[0].y + 0.4, path[0].z - 0.3);
  tailTip.rotation.x = 1.2;
  // 云（底下）
  const cloud = box(1.6, 0.35, 1.6, COL.dragonBelly);
  cloud.position.set(0, -0.4, 0);
  const cl2 = box(0.8, 0.5, 0.8, COL.dragonBelly);
  cl2.position.set(0.3, -0.2, 0.3);

  g.add(...segs, head, [horn(-1), horn(1)], whi, whi2, jaw, orb, [wing(-1), wing(1)], tailTip, cloud, cl2,
        ...eyes(head.position.x, head.position.y + 0.05, head.position.z + 0.42).children.map(m => { m.position.y += 0; return m; }));
  return g;
}

/* ============================================================
   6. 巳 · 蛇  ——  紫电蛇王 + 眼镜蛇 + 紫宝石
   ============================================================ */
function makeBoss_Snake() {
  const g = new THREE.Group();
  // 盘旋的身（环形）
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    const r = 0.55 - i * 0.05;
    const h = 0.45 - i * 0.04;
    const seg = tor(r, 0.18, 5, COL.snake);
    seg.position.set(0, h, 0);
    seg.rotation.x = Math.PI / 2;
    // 因为 tor 是平躺的，倾斜让蛇绕出立体
    seg.rotation.z = 0.4 - i * 0.15;
    g.add(seg);
  }
  // 中心紫宝石
  const orb = gem(0.28, 0x9040d0, { em: 0xc060ff, ei: 0.7 });
  orb.position.set(0, 0.5, 0);
  // 蛇头（眼镜蛇，兜帽张开）
  const hood = cone(0.7, 1.0, 5, COL.snake);
  hood.position.set(0, 1.6, 0);
  // 头（兜帽顶端）
  const head = box(0.45, 0.35, 0.4, COL.snakeDark);
  head.position.set(0, 2.05, 0);
  // 兜帽底色
  const hoodBack = box(0.85, 0.7, 0.1, COL.snakeDark);
  hoodBack.position.set(0, 1.7, -0.35);
  // 蛇眼（发光）
  const eL = sph(0.08, 0xff44ff, { em: 0xff44ff, ei: 1 });
  eL.position.set(-0.15, 2.05, 0.25);
  const eR = eL.clone(); eR.position.x = 0.15;
  // 分叉信子
  const ton1 = box(0.04, 0.04, 0.4, 0xff3399);
  ton1.position.set(0, 1.85, 0.4);
  const ton2 = ton1.clone();
  ton2.rotation.x = 0.5; ton2.position.set(-0.08, 1.83, 0.42);
  const ton3 = ton1.clone();
  ton3.rotation.x = -0.5; ton3.position.set(0.08, 1.83, 0.42);

  g.add(hood, hoodBack, head, orb, eL, eR, ton1, ton2, ton3);
  return g;
}

  // 4 短腿
  const leg = (x, z) => {
    const l = box(0.3, 0.55, 0.3, COL.pigDark);
    l.position.set(x, 0.28, z);
    return l;
  };
  const legs = [
    leg(-0.42, 0.55), leg(0.42, 0.55),
    leg(-0.42, -0.55), leg(0.42, -0.55)
  ];
  // 装备：钉耙（横放）
  const rake = cyl(0.06, 0.06, 1.6, 6, 0xc18a3e, { metal: 0.7 });
  rake.position.set(0.85, 1.0, 0.2);
  rake.rotation.z = -0.3;
  // 耙齿
  for (let i = -1; i <= 1; i++) {
    const t = cone(0.03, 0.35, 3, 0xc18a3e, { metal: 0.7 });
    t.position.set(1.45, 0.3 + i * 0.18, 0.2);
    t.rotation.z = -0.3;
    g.add(t);
  }
  // 卷尾
  const tail = cyl(0.06, 0.04, 0.4, 5, COL.pigDark);
  tail.position.set(0, 1.25, -0.85);
  tail.rotation.x = 0.8;

  g.add(body, belly, head, snout, nostrilL, nostrilR, eyeL, eyeR, band, [].concat(...[-1, 1].map(ear)),
        ...legs, rake, tail);
  return g;
}

/* ============================================================
   BOSS 列表 + 场景搭建
   ============================================================ */
const BOSSES = [
  { name: '子·鼠', en: 'Rat',     z: 0, make: makeBoss_Rat,     palette: 0xdc2a2a },
  { name: '丑·牛', en: 'Ox',      z: 1, make: makeBoss_Ox,      palette: 0xb02020 },
  { name: '寅·虎', en: 'Tiger',   z: 2, make: makeBoss_Tiger,   palette: 0xe87a2c },
  { name: '卯·兔', en: 'Rabbit',  z: 3, make: makeBoss_Rabbit,  palette: 0x2f8c4a },
  { name: '辰·龙', en: 'Dragon',  z: 4, make: makeBoss_Dragon,  palette: 0x4fc7e0 },
  { name: '巳·蛇', en: 'Snake',   z: 5, make: makeBoss_Snake,   palette: 0x6b3aa0 },
  { name: '午·马', en: 'Horse',   z: 6, make: makeBoss_Horse,   palette: 0xff6b35 },
  { name: '未·羊', en: 'Goat',    z: 7, make: makeBoss_Goat,    palette: 0x6cd4f7 },
  { name: '申·猴', en: 'Monkey',  z: 8, make: makeBoss_Monkey,  palette: 0xd4a849 },
  { name: '酉·鸡', en: 'Rooster', z: 9, make: makeBoss_Rooster, palette: 0xe63850 },
  { name: '戌·狗', en: 'Dog',     z: 10, make: makeBoss_Dog,    palette: 0xc0382e },
  { name: '亥·猪', en: 'Pig',     z: 11, make: makeBoss_Pig,    palette: 0xb8843a }
];

/* ============================================================
   场景
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 28, 70);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 14, 36);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.target.set(0, 2, 0);

// 灯光
scene.add(new THREE.AmbientLight(0x556680, 0.6));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(12, 18, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -30;
keyLight.shadow.camera.right = 30;
keyLight.shadow.camera.top = 30;
keyLight.shadow.camera.bottom = -30;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
fillLight.position.set(-10, 8, -10);
scene.add(fillLight);

// 地面 + 网格
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x0f1c30, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// 装饰网格（淡蓝线）
const grid = new THREE.GridHelper(60, 60, 0x1e3a5f, 0x142436);
grid.position.y = 0.005;
scene.add(grid);

// 4×3 阵列
const COLS = 4, ROWS = 3, GAP = 9;
const bossGroup = new THREE.Group();
const bossMeshes = [];
BOSSES.forEach((b, i) => {
  const g = b.make();
  // 加底盘
  const ped = pedestal();
  g.add(ped);
  // 摆位
  const x = (i % COLS - (COLS - 1) / 2) * GAP;
  const z = (Math.floor(i / COLS) - (ROWS - 1) / 2) * GAP;
  g.position.set(x, 0, z);
  g.userData = {
    baseY: 0, phase: Math.random() * Math.PI * 2, idx: i, info: b
  };
  bossGroup.add(g);
  bossMeshes.push(g);
});
scene.add(bossGroup);

// 自适应
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ============================================================
   交互 · 拾取 · 聚焦
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const nameTag = document.getElementById('nameTag');
let focusedBoss = null;
let focusAnim = null;
let autoRotate = false;
const camStart = camera.position.clone();
const targetStart = controls.target.clone();

function pickAt(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(bossMeshes, true);
  if (!hits.length) return null;
  // 找到顶层 boss Group
  let o = hits[0].object;
  while (o && !o.userData?.info) o = o.parent;
  return o;
}

function focusBoss(g) {
  if (!g) return;
  focusedBoss = g;
  const wp = new THREE.Vector3();
  g.getWorldPosition(wp);
  const targetCam = wp.clone().add(new THREE.Vector3(2.5, 3, 5));
  focusAnim = {
    t: 0, fromCam: camera.position.clone(), toCam: targetCam,
    fromTgt: controls.target.clone(), toTgt: wp.clone().add(new THREE.Vector3(0, 1.4, 0))
  };
  // 显示名牌
  nameTag.textContent = g.userData.info.name;
  nameTag.style.borderColor = '#' + g.userData.info.palette.toString(16).padStart(6, '0');
  nameTag.style.color = '#' + g.userData.info.palette.toString(16).padStart(6, '0');
  nameTag.classList.add('show');
}

function unfocus() {
  focusedBoss = null;
  focusAnim = {
    t: 0, fromCam: camera.position.clone(), toCam: camStart,
    fromTgt: controls.target.clone(), toTgt: targetStart
  };
  nameTag.classList.remove('show');
}

canvas.addEventListener('click', (e) => {
  if (e.target !== canvas) return;
  const g = pickAt(e.clientX, e.clientY);
  if (g) {
    if (focusedBoss === g) unfocus(); else focusBoss(g);
  }
});
canvas.addEventListener('dblclick', unfocus);

/* ============================================================
   按钮 / 快捷键
   ============================================================ */
document.getElementById('btnReset').onclick = unfocus;
const btnAuto = document.getElementById('btnAuto');
btnAuto.onclick = () => {
  autoRotate = !autoRotate;
  btnAuto.classList.toggle('on', autoRotate);
  btnAuto.textContent = autoRotate ? '⏸ 停止旋转' : '▶ 自动旋转';
};
document.getElementById('btnRandom').onclick = () => {
  bossMeshes.forEach(g => {
    g.userData.shake = { t: 0, amp: 0.15 + Math.random() * 0.2 };
  });
};
document.getElementById('btnPNG').onclick = () => {
  if (focusedBoss) {
    renderer.render(scene, camera);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = focusedBoss.userData.info.en + '.png';
      a.click();
    });
  } else {
    renderer.render(scene, camera);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'bosses-all.png';
      a.click();
    });
  }
};
document.getElementById('btnCode').onclick = () => {
  const text = bossMeshes.map(g => `function makeBoss_${g.userData.info.en}(){ /* TODO 拷贝展示版本里的代码 */ }`).join('\n\n');
  alert('请打开本 HTML 查看 makeBoss_XX 函数。本页所有 12 个函数均为纯函数，可直接整段拷贝到你的游戏引擎使用。');
};

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') unfocus();
  if (e.key === 'a' || e.key === 'A') btnAuto.click();
  if (e.key === 's' || e.key === 'S') document.getElementById('btnPNG').click();
});

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // 每个 BOSS 浮动 & 抖动
  bossMeshes.forEach(g => {
    if (g !== focusedBoss) {
      g.position.y = g.userData.baseY + Math.sin(t * 0.9 + g.userData.phase) * 0.08;
    } else {
      g.position.y = g.userData.baseY;
    }
    g.rotation.y += dt * 0.25;
    if (g.userData.shake) {
      g.userData.shake.t += dt;
      const k = Math.max(0, 1 - g.userData.shake.t * 2.5);
      const a = g.userData.shake.amp * k;
      g.position.x += (Math.random() - 0.5) * a;
      g.position.z += (Math.random() - 0.5) * a;
      if (k <= 0) g.userData.shake = null;
    }
  });

  // 聚焦动画
  if (focusAnim) {
    focusAnim.t += dt * 1.4;
    const k = Math.min(1, focusAnim.t);
    const ease = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(focusAnim.fromCam, focusAnim.toCam, ease);
    controls.target.lerpVectors(focusAnim.fromTgt, focusAnim.toTgt, ease);
    if (k >= 1) focusAnim = null;
  }

  if (autoRotate && !focusedBoss) {
    const a = dt * 0.15;
    const c = Math.cos(a), s = Math.sin(a);
    const px = camera.position.x, pz = camera.position.z;
    camera.position.x = px * c - pz * s;
    camera.position.z = px * s + pz * c;
    camera.lookAt(controls.target);
  }

  controls.update();
  renderer.render(scene, camera);
}

document.getElementById('loading').classList.add('hide');
animate();

/* ============================================================
   暴露到 window · 供你在 devtools 里把玩
   ============================================================ */
window.__BOSS = { THREE, scene, camera, bossMeshes, BOSSES };
</script>
